name: IaaS EE build

on:
  push:
    branches:
      - main
    paths:
      - 'ee-iaas/**'

  workflow_dispatch:

jobs:
  call-deploy-workflow:
    uses: pumphouse-p/ansible-execution-environments/.github/workflows/build-and-push.yml@main
